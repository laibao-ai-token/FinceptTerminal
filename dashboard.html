<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fincept 资金盘面</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #0f1420; color: #dbe2ee; padding: 16px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: #1a2233; border-radius: 10px; padding: 14px 16px; border: 1px solid #26304a; }
  .card .label { font-size: 12px; color: #8b96ad; margin-bottom: 6px; }
  .card .value { font-size: 22px; font-weight: 600; }
  .up { color: #4ade80; } .down { color: #f87171; }
  .row { display: grid; grid-template-columns: 3fr 2fr; gap: 12px; margin-bottom: 12px; }
  .panel { background: #1a2233; border: 1px solid #26304a; border-radius: 10px; padding: 14px; }
  .panel h3 { font-size: 14px; color: #8b96ad; margin-bottom: 10px; }
  #flowChart { height: 300px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid #26304a; white-space: nowrap; }
  th { color: #8b96ad; font-weight: 500; }
  td:first-child, th:first-child, td:nth-child(2), th:nth-child(2) { text-align: left; }
  .btn { background: #2e6bff; color: #fff; border: 0; border-radius: 8px; padding: 8px 16px; cursor: pointer; font-size: 14px; }
  .btn:hover { background: #1f56d8; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .topbar h1 { font-size: 18px; }
  .muted { color: #8b96ad; }
  .pill { display:inline-block; padding:2px 8px; border-radius:6px; font-size:12px; }
  .pill-buy { background:#143524; color:#4ade80; } .pill-sell { background:#3a1520; color:#f87171; }
</style>
</head>
<body>
<div class="topbar">
  <h1>Fincept 资金盘面</h1>
  <div><button class="btn" onclick="refreshAll()">刷新行情</button></div>
</div>

<div class="cards" id="cards"></div>

<div class="row">
  <div class="panel"><h3>资金流向（近90天 · 买入/卖出/费用/累计净流入）</h3><div id="flowChart"></div></div>
  <div class="panel"><h3>持仓</h3><div id="positions" style="max-height:300px;overflow:auto"></div></div>
</div>

<div class="row">
  <div class="panel"><h3>最近交易</h3><div id="trades" style="max-height:300px;overflow:auto"></div></div>
  <div class="panel"><h3>最近订单（决策记录）</h3><div id="orders" style="max-height:300px;overflow:auto"></div></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (n) => (n === null || n === undefined) ? '-' : Number(n).toLocaleString('zh-CN', {maximumFractionDigits: 2});
const TS = () => new Date(Date.now() + 8*3600*1000).toISOString().slice(0, 19).replace('T', ' ');

async function load() {
  const [ov, pos, cf, tr, or] = await Promise.all([
    fetch('/api/overview').then(r => r.json()),
    fetch('/api/positions').then(r => r.json()),
    fetch('/api/cashflow').then(r => r.json()),
    fetch('/api/trades').then(r => r.json()),
    fetch('/api/orders').then(r => r.json()),
  ]);
  renderCards(ov); renderFlow(cf); renderPositions(pos); renderTrades(tr); renderOrders(or);
}

function renderCards(ov) {
  $('cards').innerHTML = ov.map(p => {
    const pnl = p.total_assets - p.initial;
    return `<div class="card">
      <div class="label">${p.name} (${p.currency})</div>
      <div class="value">${fmt(p.total_assets)}</div>
      <div class="label">现金 ${fmt(p.cash)} · 市值 ${fmt(p.market_value)} · ${p.positions} 个持仓</div>
      <div class="label ${pnl>=0?'up':'down'}">累计盈亏 ${fmt(pnl)} · 费用 ${fmt(p.total_fees)}</div>
    </div>`;
  }).join('');
}

function renderFlow(cf) {
  const chart = echarts.init($('flowChart'));
  chart.setOption({
    backgroundColor: 'transparent',
    tooltip: { trigger: 'axis' },
    legend: { textStyle: { color: '#8b96ad' }, data: ['买入', '卖出', '费用', '累计净流入'] },
    grid: { left: 60, right: 20, top: 30, bottom: 30 },
    xAxis: { type: 'category', data: cf.map(x => x.date.slice(5)), axisLabel: { color: '#8b96ad' } },
    yAxis: [{ type: 'value', axisLabel: { color: '#8b96ad' }, splitLine: { lineStyle: { color: '#26304a' } } },
            { type: 'value', axisLabel: { color: '#8b96ad' }, splitLine: { show: false } }],
    series: [
      { name: '买入', type: 'bar', stack: 't', data: cf.map(x => x.buy), itemStyle: { color: '#f87171' } },
      { name: '卖出', type: 'bar', stack: 't', data: cf.map(x => x.sell), itemStyle: { color: '#4ade80' } },
      { name: '费用', type: 'bar', data: cf.map(x => x.fee), itemStyle: { color: '#eab308' } },
      { name: '累计净流入', type: 'line', yAxisIndex: 1, data: cf.map(x => x.net), itemStyle: { color: '#2e6bff' } },
    ],
  });
}

function renderPositions(pos) {
  if (!pos.length) { $('positions').innerHTML = '<div class="muted">空仓</div>'; return; }
  $('positions').innerHTML = `<table>
    <tr><th>标的</th><th>数量</th><th>成本</th><th>现价</th><th>市值</th><th>浮动盈亏</th></tr>
    ${pos.map(p => {
      const cost = p.entry_price || 0, price = p.current_price || cost;
      const mkt = price * p.quantity, pnl = mkt - cost * p.quantity;
      return `<tr>
        <td>${p.symbol}</td><td>${fmt(p.quantity)}</td><td>${fmt(cost)}</td>
        <td>${fmt(price)}</td><td>${fmt(mkt)}</td>
        <td class="${pnl>=0?'up':'down'}">${fmt(pnl)} (${cost ? ((price/cost-1)*100).toFixed(1) : 0}%)</td></tr>`;
    }).join('')}</table>`;
}

function renderTrades(tr) {
  if (!tr.length) { $('trades').innerHTML = '<div class="muted">暂无交易</div>'; return; }
  $('trades').innerHTML = `<table>
    <tr><th>时间</th><th>组合</th><th>标的</th><th>方向</th><th>价格</th><th>数量</th><th>费用</th><th>盈亏</th></tr>
    ${tr.map(t => `<tr><td>${t.timestamp.slice(0,19)}</td><td>${t.pname}</td><td>${t.symbol}</td>
      <td><span class="pill pill-${t.side}">${t.side}</span></td>
      <td>${fmt(t.price)}</td><td>${fmt(t.quantity)}</td><td>${fmt(t.fee)}</td>
      <td class="${(t.pnl||0)>=0?'up':'down'}">${fmt(t.pnl)}</td></tr>`).join('')}</table>`;
}

function renderOrders(or) {
  if (!or.length) { $('orders').innerHTML = '<div class="muted">暂无订单</div>'; return; }
  $('orders').innerHTML = `<table>
    <tr><th>时间</th><th>组合</th><th>标的</th><th>方向</th><th>类型</th><th>状态</th><th>价格</th><th>数量</th></tr>
    ${or.map(o => `<tr><td>${o.created_at.slice(0,19)}</td><td>${o.pname}</td><td>${o.symbol}</td>
      <td><span class="pill pill-${o.side}">${o.side}</span></td><td>${o.order_type}</td><td>${o.status}</td>
      <td>${fmt(o.price)}</td><td>${fmt(o.filled_qty)}</td></tr>`).join('')}</table>`;
}

async function refreshAll() {
  await fetch('/api/refresh', { method: 'POST' });
  load();
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
